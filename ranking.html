<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking · FIFA Soundtrack Ranking</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/" class="brand-link">
        <span class="logo">⚽</span>
        <h1>FIFA Soundtrack Ranking</h1>
      </a>
    </div>
    <nav class="nav">
      <a href="/" class="nav-link">Vote</a>
      <a href="/ranking.html" class="nav-link active">Ranking</a>
    </nav>
  </header>

  <main>
    <section id="ranking" class="ranking ranking-page">
      <div class="ranking-head">
        <h2>Overall ranking</h2>
        <div class="stats">
          <span><strong id="stat-songs">0</strong> songs</span>
        </div>
        <div class="ranking-controls">
          <label for="ranking-filter">Filter by edition</label>
          <select id="ranking-filter" class="filter-select">
            <option value="">All editions</option>
          </select>
          <span class="filter-count" id="filter-count"></span>
        </div>
      </div>
      <ol id="ranking-list" class="ranking-list">
        <li class="rank-loading">Loading ranking…</li>
      </ol>
    </section>
  </main>

  <footer class="footer">
    <span>Shared, persistent ranking.</span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
