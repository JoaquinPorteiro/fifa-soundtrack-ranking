<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA Soundtrack Ranking</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/" class="brand-link">
        <span class="logo">⚽</span>
        <h1>FIFA Soundtrack Ranking</h1>
      </a>
    </div>
    <nav class="nav">
      <a href="/" class="nav-link active">Votar</a>
      <a href="/ranking.html" class="nav-link">Ranking</a>
    </nav>
  </header>

  <main>
    <section id="vote" class="hero">
      <div class="hero-head">
        <h2>¿Cuál te gusta más?</h2>
        <p class="subtitle">Hacé clic en tu favorita. El ranking se ajusta con sistema ELO (estilo ajedrez).</p>
        <div class="stats">
          <span><strong id="stat-matches">0</strong> duelos jugados</span>
          <span><strong id="stat-songs">0</strong> canciones</span>
        </div>
      </div>

      <div class="duel">
        <div class="card" id="card-a" data-side="a" role="button" tabindex="0">
          <div class="card-media" data-field="media"></div>
          <div class="card-body">
            <div class="card-fifa" data-field="fifa"></div>
            <div class="card-title" data-field="title"></div>
            <div class="card-artist" data-field="artist"></div>
            <div class="card-rating" data-field="rating"></div>
          </div>
          <div class="card-pick">Elegir</div>
        </div>

        <div class="vs">VS</div>

        <div class="card" id="card-b" data-side="b" role="button" tabindex="0">
          <div class="card-media" data-field="media"></div>
          <div class="card-body">
            <div class="card-fifa" data-field="fifa"></div>
            <div class="card-title" data-field="title"></div>
            <div class="card-artist" data-field="artist"></div>
            <div class="card-rating" data-field="rating"></div>
          </div>
          <div class="card-pick">Elegir</div>
        </div>
      </div>

      <div class="skip-row">
        <button id="skip-btn" class="ghost">Saltar duelo →</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Ranking compartido y persistente. Tu voto cuenta para todos.</span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
